name: Build & Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Recreate/update release assets even if tag already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    # Run ONLY when a PR is actually merged into main (never on open/push/unmerged close),
    # or when triggered manually via workflow_dispatch (e.g., for initial v0.4.0 release).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read VERSION and check tag
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: gate
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.tag_exists }}" == "false" || "${{ inputs.force_release }}" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping release build. Bump VERSION to cut a new release."
          fi

      - name: Setup Go
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & Test
        if: steps.gate.outputs.should_release == 'true'
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile Windows, Linux (Ubuntu/Debian), and macOS binaries
        if: steps.gate.outputs.should_release == 'true'
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VER="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          LDFLAGS="-s -w -X personalcrm/internal/cli.Version=${VER}"

          # Note: All targets compile with zero CGO on a single ubuntu-latest runner.
          # If macOS introduces CGO-dependent tray bindings in Phase 6, split darwin builds onto macos-latest.
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o "dist/pcrm-${TAG}-windows-amd64.exe" ./cmd/pcrm
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o "dist/pcrm-${TAG}-linux-amd64"       ./cmd/pcrm
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o "dist/pcrm-${TAG}-darwin-amd64"      ./cmd/pcrm
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o "dist/pcrm-${TAG}-darwin-arm64"      ./cmd/pcrm

          (cd dist && sha256sum pcrm-* > SHA256SUMS.txt)
          ls -lh dist/

      - name: Create GitHub Release
        if: steps.gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PersonalCRM ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/pcrm-*
            dist/SHA256SUMS.txt
